# Surge iOS public template / 公开模板
# 本文件没有节点、订阅地址、WireGuard 密钥或 MITM CA。
# LOCAL-* 是默认 REJECT 的占位策略，使用前需配置自己的节点。
# 这不是原配置的完整运行副本；差异及第三方来源见仓库文档。
# PRIVATE-SLOT 标记供本地工具恢复私密内容，请保留。

[General]
wifi-assist = true
all-hybrid = false
udp-priority = true
# BEGIN PRIVATE-SLOT S001
internet-test-url = http://www.apple.com/library/test/success.html
# END PRIVATE-SLOT S001
proxy-test-url = http://cp.cloudflare.com/generate_204
test-timeout = 5
geoip-maxmind-url = https://github.com/Hackl0us/GeoIP2-CN/raw/release/Country.mmdb
ipv6 = true
ipv6-vif = auto
allow-wifi-access = false
allow-hotspot-access = false
compatibility-mode = 3
skip-proxy = localhost, *.local, captive.apple.com, 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 192.88.99.0/24, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4, 255.255.255.255/32
exclude-simple-hostnames = true
include-all-networks = false
include-local-networks = false
include-apns = false
include-cellular-services = false
use-local-host-item-for-proxy = false
encrypted-dns-follow-outbound-mode = true
dns-server = system, 223.5.5.5
encrypted-dns-server = https://dns.alidns.com/dns-query
hijack-dns = 8.8.8.8:53, 8.8.4.4:53
loglevel = notify
show-error-page-for-reject = true
always-real-ip = link-ip.nextdns.io, *.msftconnecttest.com, *.msftncsi.com, *.srv.nintendo.net, *.stun.playstation.net, xbox.*.microsoft.com, *.xboxlive.com, *.logon.battlenet.com.cn, *.logon.battle.net, stun.l.google.com
udp-policy-not-supported-behaviour = REJECT
block-quic = per-policy
proxy-restricted-to-lan = true
encrypted-dns-skip-cert-verification = false

[Proxy]
# BEGIN PRIVATE-SLOT S002
# 在本地导入节点；公开仓库保持为空。
# END PRIVATE-SLOT S002

