name: Check public files

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check public material
        run: python3 scripts/check_public.py
      - name: Check imported module dependencies
        run: python3 scripts/check_module_dependencies.py
      - name: Verify app modules can be rebuilt offline
        run: python3 scripts/build_apps.py --check
      - name: Check app response handling
        run: node tests/apps_runtime.cjs
      - name: Check DiDi native jq conversion
        run: node tests/didi_runtime.cjs
      - name: Check SPDB image filtering
        run: node tests/spdb_runtime.cjs
